name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q
      - name: 字種・制御文字の検査(G-10)
        run: python harness/text_hygiene.py
      - name: ループログの検証(LL-11)
        run: python harness/looplog.py validate

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: build(静的書き出し)
        run: npm run build
